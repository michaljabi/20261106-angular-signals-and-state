<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Angular Live Theory</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <meta name="color-scheme" content="light dark" />
    <!-- Bootstrap color mode follows OS/browser. Inline + blocking on purpose: runs before
         first paint (no light→dark flash on prerendered HTML), outside Angular. -->
    <script>
      (() => {
        const mq = matchMedia('(prefers-color-scheme: dark)');
        const apply = () =>
          document.documentElement.setAttribute('data-bs-theme', mq.matches ? 'dark' : 'light');
        apply();
        mq.addEventListener('change', apply);
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
