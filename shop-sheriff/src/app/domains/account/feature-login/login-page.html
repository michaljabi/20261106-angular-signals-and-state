<app-page-header title="Log in" subtitle="Demo password for every user: Shop!2026" />

<div class="row g-4">
  <div class="col-12 col-md-6 col-lg-5">
    <form [formRoot]="loginForm" class="card card-body">
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input
          id="email"
          type="email"
          class="form-control"
          autocomplete="username"
          [formField]="loginForm.email"
          [class.is-invalid]="loginForm.email().touched() && loginForm.email().invalid()"
        />
        @for (error of loginForm.email().errors(); track $index) {
          <div class="invalid-feedback">{{ error.message }}</div>
        }
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input
          id="password"
          type="password"
          class="form-control"
          autocomplete="current-password"
          [formField]="loginForm.password"
          [class.is-invalid]="loginForm.password().touched() && loginForm.password().invalid()"
        />
        @for (error of loginForm.password().errors(); track $index) {
          <div class="invalid-feedback">{{ error.message }}</div>
        }
      </div>
      <app-problem-alert [problem]="problem()" />
      <button type="submit" class="btn btn-primary" [disabled]="loginForm().submitting()">
        Log in
      </button>
    </form>
  </div>

  <div class="col-12 col-md-6 col-lg-7">
    <h2 class="h6 text-body-secondary">Demo users (click to fill)</h2>
    <div class="list-group">
      @for (u of demoUsers; track u.email) {
        <button
          type="button"
          class="list-group-item list-group-item-action d-flex justify-content-between"
          (click)="fill(u.email)"
        >
          <span
            >{{ u.name }} <small class="text-body-secondary">{{ u.email }}</small></span
          >
          <span class="badge text-bg-secondary">{{ u.role }}</span>
        </button>
      }
    </div>
  </div>
</div>
